<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Content Form</title>
  <!-- Quill CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    .container { padding: 1rem; max-width: 600px; margin: auto; }
    .editor { height: 250px; margin-bottom: 2rem; }
    .btn { background: #3b82f6; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #2563eb; }
    input { border: 1px solid #ccc; padding: 0.5rem; width: 100%; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <input id="title" placeholder="Page Title" />

    <!-- Rich Text Editor -->
    <div id="editor" class="editor"></div>

    <button class="btn" onclick="handleSubmit()">Save Page</button>
  </div>

  <!-- Quill JS -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>
    // Initialize Quill editor
    var quill = new Quill('#editor', {
      theme: 'snow'
    });

    async function handleSubmit() {
      const title = document.getElementById('title').value;
      const content = quill.root.innerHTML; // HTML string from editor

      const payload = {
        slug: title.toLowerCase().replace(/ /g, '-'),
        title: title,
        content: content,
        updated_by: 1
      };

      try {
        await axios.post('http://localhost:8000/api/content/content', payload);
        alert('Content Saved!');
      } catch (error) {
        console.error("Error saving:", error);
        alert('Error saving content');
      }
    }
  </script>
</body>
</html>
