version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: coolify_db
      MYSQL_USER: user
      # ⚠️ Use a variable here, don't type the password!
      MYSQL_PASSWORD: ${DB_PASSWORD} 
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: .
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_NAME=coolify_db
      # ⚠️ Use the same variable here so they match
      - DB_PASS=${DB_PASSWORD}